<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Page not found | Praveen Isukapalli</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/avatar.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/sections.css" />
  <script src="/js/theme-init.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-grid"></div>
    <div class="backdrop-orb one"></div>
    <div class="backdrop-orb two"></div>
  </div>

  <main class="not-found">
    <div>
      <h1 class="gradient-text">404</h1>
      <div class="terminal">
        <div class="terminal-bar">
          <div class="terminal-dots" aria-hidden="true"><span></span><span></span><span></span></div>
          <span class="terminal-title">praveen@portfolio: ~</span>
        </div>
        <div class="terminal-body">
          <div class="term-line"><span class="term-prompt">❯</span> <span class="term-cmd">GET this-page</span></div>
          <div class="term-line"><span class="term-error">Error 404: route not found</span></div>
          <div class="term-line term-muted">The page you're looking for was moved, renamed or never existed.</div>
        </div>
      </div>
      <a href="/" class="btn btn-primary">
        <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-arrow-right" /></svg>
        Back to the homepage
      </a>
    </div>
  </main>
</body>
</html>
